# Render's free web services spin down after 15 minutes without traffic and
# take 30-60s to wake — long enough that the static site's /api rewrite times
# out for the first visitor. Pinging the health endpoint every 10 minutes
# keeps the API warm; the free 750 instance-hours/month already cover 24/7
# uptime, so staying awake costs nothing.
#
# UPDATE the URL below to the API service's real URL after the first deploy.
# Note: GitHub pauses scheduled workflows after 60 days without repo activity
# (re-enable under Actions, or use cron-job.org instead).
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 60 --retry 3 https://cinescope-api.onrender.com/api/health
